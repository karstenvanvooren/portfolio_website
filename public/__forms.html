<!doctype html>
<!--
  Netlify Forms detection file. Netlify scans static HTML at deploy time to
  learn which forms exist; Next.js pages aren't static HTML, so the contact
  form is declared here instead. ContactForm.tsx posts to this file's URL.
  Keep the form name and field names in sync with ContactForm.tsx.
  See https://opennext.js.org/netlify/forms
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
